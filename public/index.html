<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CodeConClave AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#161922; --rail:#12141b; --line:#262b36; --fg:#e8ebf2; --dim:#9aa3b2;
    --gold:#d9b25a; --accent:#6ea8fe; --radius:12px;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;height:100vh;overflow:hidden}
  .rail{width:260px;flex:0 0 260px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .2s}
  .rail__top{padding:16px 14px 10px}
  .logo{font-size:15px;font-weight:800;letter-spacing:1.5px}.logo b{color:var(--gold)}
  .newbtn{margin:10px 14px;padding:10px;border:1px solid var(--line);background:#1b2030;color:var(--fg);border-radius:10px;cursor:pointer;font:inherit;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
  .newbtn:hover{border-color:var(--gold)}
  .convos{flex:1;overflow-y:auto;padding:6px 8px}
  .cnv{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--dim);font-size:13.5px}
  .cnv:hover{background:#1b2030;color:var(--fg)}.cnv.active{background:#223049;color:#eaf1ff}
  .cnv__t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cnv__x{opacity:0;border:none;background:none;color:var(--dim);cursor:pointer;font-size:15px}.cnv:hover .cnv__x{opacity:.7}.cnv__x:hover{color:#ff8a8a;opacity:1}
  .rail__foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:11.5px}
  .memlink{color:var(--gold);cursor:pointer;background:none;border:none;font:inherit;font-size:11.5px}

  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .burger{display:none;border:none;background:none;color:var(--fg);font-size:20px;cursor:pointer}
  .top__title{font-weight:700}.top__title b{color:var(--gold)}
  #chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:18px 16px}
  .wrap{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .msg{padding:11px 14px;border-radius:12px;max-width:85%;line-height:1.55;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:#223049;color:#eaf1ff;border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .ai .who{color:var(--gold);font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;display:block}
  .err{align-self:center;color:#ff8a8a;font-size:13px;text-align:center}
  .empty{margin:auto;text-align:center;color:var(--dim)}.empty .big{font-size:20px;color:var(--fg);font-weight:700;margin-bottom:6px}.empty .big b{color:var(--gold)}
  .dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--gold);animation:b 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}

  .barwrap{padding:8px 16px 18px}
  .files{width:100%;max-width:760px;margin:0 auto 6px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:flex;align-items:center;gap:6px;background:#1b2030;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--fg)}
  .chip b{color:var(--gold);font-weight:600}.chip button{border:none;background:none;color:var(--dim);cursor:pointer;font-size:14px}
  .bar{width:100%;max-width:760px;margin:0 auto;display:flex;gap:6px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px;position:relative}
  .plus{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:none;background:#1b2030;color:var(--fg);font-size:20px;cursor:pointer}
  .plus:hover{color:var(--gold)}
  .menu{position:absolute;bottom:48px;left:6px;background:#1b2030;border:1px solid var(--line);border-radius:10px;padding:6px;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;z-index:5}
  .menu.open{display:block}
  .menu button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--fg);font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;cursor:pointer}
  .menu button:hover{background:#223049}.menu button:disabled{color:var(--dim);cursor:default}.menu button:disabled:hover{background:none}
  .menu .soon{margin-left:auto;font-size:10px;color:var(--dim)}
  .menu button svg{width:17px;height:17px;flex:0 0 auto;color:var(--dim)}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#223049;border:1px solid var(--line);color:var(--fg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .slash{position:absolute;bottom:48px;left:46px;right:10px;background:#1b2030;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;z-index:6}
  .slash.open{display:block}
  .slashrow{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:none;border:none;color:var(--fg);font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .slashrow:hover,.slashrow.sel{background:#223049}
  .slashrow b{color:var(--gold);font-weight:600}.slashrow span{color:var(--dim);font-size:12.5px}
  textarea{flex:1;min-width:0;resize:none;background:transparent;color:var(--fg);border:none;font:inherit;font-size:15px;padding:8px;max-height:150px}
  textarea:focus{outline:none}
  .send{flex:0 0 auto;cursor:pointer;border:none;border-radius:10px;padding:0 16px;height:34px;font:inherit;font-weight:700;background:var(--gold);color:#201a08}
  .send:disabled{opacity:.5;cursor:default}
  .backdrop{display:none}
  @media(max-width:720px){
    .rail{position:fixed;z-index:20;height:100%;margin-left:-260px}
    body.open .rail{margin-left:0}
    body.open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
    .burger{display:block}
  }
</style>
</head>
<body>
  <aside class="rail">
    <div class="rail__top"><div class="logo">CODE<b>CON</b>CLAVE</div></div>
    <button class="newbtn" id="newBtn">＋ New chat</button>
    <div class="convos" id="convos"></div>
    <div class="rail__foot"><span id="footNote">Your own AI</span><button class="memlink" id="memBtn">🧠 Memory</button></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="toast" id="toast"></div>

  <div class="main">
    <div class="top"><button class="burger" id="burger">☰</button><div class="top__title">CODE<b>CON</b>CLAVE AI</div></div>
    <div id="chat"></div>
    <div class="barwrap">
      <div class="files" id="files"></div>
      <div class="bar">
        <button class="plus" id="plus" title="Add files">＋</button>
        <div class="menu" id="menu">
          <button id="addFiles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg> Add files or photos</button>
          <button id="addFolder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Add folder</button>
          <button id="slashCmd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><line x1="14.5" y1="7.5" x2="9.5" y2="16.5"/></svg> Slash commands</button>
          <button id="connectors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg> Connectors</button>
          <button id="addPlugins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a1 1 0 0 1 1-1h2.5V5.5a2 2 0 1 1 4 0V7H15a1 1 0 0 1 1 1v2.5h1.5a2 2 0 1 1 0 4H16V17a1 1 0 0 1-1 1h-3v-1.5a2 2 0 1 0-4 0V18H5a1 1 0 0 1-1-1z"/></svg> Add plugins</button>
        </div>
        <input type="file" id="fileInput" multiple accept=".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.pdf,.log,.xml,.yml,.yaml,image/*" style="display:none" />
        <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none" />
        <div class="slash" id="slash"></div>
        <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
        <button class="send" id="send">Send</button>
      </div>
    </div>
  </div>

<script>
  try { if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch{}
  const $ = (id) => document.getElementById(id);
  const chat=$('chat'), input=$('input'), sendBtn=$('send'), convosEl=$('convos'), filesEl=$('files');
  const CKEY='cc_convos_v1', MKEY='cc_memory_v1';
  let convos=[], currentId=null, busy=false, memory=[], pending=[]; // pending = files attached to the next message

  function load(){ try{convos=JSON.parse(localStorage.getItem(CKEY)||'[]')||[]}catch{convos=[]} try{memory=JSON.parse(localStorage.getItem(MKEY)||'[]')||[]}catch{memory=[]} }
  function saveC(){ try{localStorage.setItem(CKEY,JSON.stringify(convos.slice(0,100)))}catch{} }
  function saveM(){ try{localStorage.setItem(MKEY,JSON.stringify(memory.slice(0,30)))}catch{} }
  const current=()=>convos.find(c=>c.id===currentId);
  const uid=()=>'c'+Date.now()+Math.random().toString(36).slice(2,6);

  function newChat(){ currentId=uid(); convos.unshift({id:currentId,title:'New chat',messages:[],updated:Date.now()}); saveC(); renderSidebar(); renderChat(); input.focus(); closeRail(); }
  function selectChat(id){ currentId=id; renderSidebar(); renderChat(); closeRail(); }
  function deleteChat(id,e){ e.stopPropagation(); convos=convos.filter(c=>c.id!==id); if(currentId===id){currentId=convos[0]?.id||null; if(!currentId)newChat();} saveC(); renderSidebar(); renderChat(); }

  function renderSidebar(){
    convosEl.innerHTML='';
    convos.forEach(c=>{ const row=document.createElement('div'); row.className='cnv'+(c.id===currentId?' active':''); row.onclick=()=>selectChat(c.id);
      const t=document.createElement('div'); t.className='cnv__t'; t.textContent=c.title||'New chat';
      const x=document.createElement('button'); x.className='cnv__x'; x.textContent='×'; x.title='Delete'; x.onclick=(e)=>deleteChat(c.id,e);
      row.append(t,x); convosEl.appendChild(row); });
  }
  function bubble(role,text){ const el=document.createElement('div'); el.className='msg '+(role==='user'?'me':'ai');
    let node; if(role!=='user'){ const w=document.createElement('span'); w.className='who'; w.textContent='CodeConClave AI'; el.appendChild(w); }
    node=document.createTextNode(text||''); el.appendChild(node); el._text=node; return el; }
  function renderChat(){
    chat.innerHTML=''; const c=current();
    if(!c||c.messages.length===0){ const e=document.createElement('div'); e.className='empty'; e.innerHTML='<div class="big">CODE<b>CON</b>CLAVE AI</div><div>Your own AI. Ask me anything, or add a file with ＋.</div>'; chat.appendChild(e); return; }
    const wrap=document.createElement('div'); wrap.className='wrap'; c.messages.forEach(m=>wrap.appendChild(bubble(m.role,m.content))); chat.appendChild(wrap); chat.scrollTop=chat.scrollHeight;
  }

  // ---- files ----
  function renderFiles(){ filesEl.innerHTML=''; pending.forEach((f,i)=>{ const c=document.createElement('span'); c.className='chip'; c.innerHTML='📄 <b></b>'; c.querySelector('b').textContent=f.name;
    const x=document.createElement('button'); x.textContent='×'; x.onclick=()=>{ pending.splice(i,1); renderFiles(); }; c.appendChild(x); filesEl.appendChild(c); }); }
  async function readFile(file){
    const isImg=/^image\//.test(file.type);
    if(isImg) return {name:file.name, text:`(An image "${file.name}" was attached. Note: I can read text and PDFs, but I can't see images yet.)`};
    if(/\.pdf$/i.test(file.name) && window.pdfjsLib){
      try{ const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise; let t='';
        for(let p=1;p<=Math.min(pdf.numPages,30);p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); t+=tc.items.map(i=>i.str).join(' ')+'\n'; }
        return {name:file.name, text:t.slice(0,40000)}; }catch{ return {name:file.name, text:'(Could not read this PDF.)'}; }
    }
    try{ const t=await file.text(); return {name:file.name, text:t.slice(0,40000)}; }catch{ return {name:file.name, text:'(Could not read this file.)'}; }
  }
  const TEXTY=/\.(txt|md|csv|json|js|ts|jsx|tsx|py|html|css|log|xml|ya?ml|java|c|cpp|h|go|rs|rb|php|sh|sql|ini|env|toml)$/i;
  async function handleFiles(list, folder){
    let arr=Array.from(list);
    if(folder) arr=arr.filter(f=>TEXTY.test(f.name)||/\.pdf$/i.test(f.name));
    for(const f of arr.slice(0, folder?12:5)){ const r=await readFile(f); pending.push(r); }
    if(folder && arr.length===0) toast('No readable text files in that folder.');
    renderFiles();
  }

  // ---- memory ----
  function captureMemory(text){
    let m, added=false;
    if((m=text.match(/\bmy name is ([A-Z][a-zA-Z'’\-]{1,30})/i))){ const f=`User's name is ${m[1]}.`; if(!memory.includes(f)){memory.push(f);added=true;} }
    const re=/\b(?:remember that|remember to|note that|keep in mind that)\s+(.{3,120})/ig; let r2;
    while((r2=re.exec(text))){ const f=r2[1].replace(/[.!]+$/,'').trim(); const line='Remember: '+f; if(f && !memory.includes(line)){memory.push(line);added=true;} }
    if(added) saveM();
  }
  function showMemory(){
    const body = memory.length ? memory.map((x,i)=>(i+1)+'. '+x).join('\n') : '(nothing yet — say "my name is …" or "remember that …")';
    if(confirm('🧠 What CodeConClave AI remembers about you:\n\n'+body+'\n\nPress OK to CLEAR all memory, or Cancel to keep it.')){ memory=[]; saveM(); }
  }

  async function send(){
    if(busy) return;
    const text=input.value.trim(); if(!text && pending.length===0) return;
    let c=current(); if(!c){ newChat(); c=current(); }
    const files=pending.slice(); pending=[]; renderFiles();
    const shown = text + (files.length?('\n'+files.map(f=>'📄 '+f.name).join('\n')):'');
    input.value=''; input.style.height='auto';
    c.messages.push({role:'user',content:shown});
    if(c.title==='New chat'||!c.title) c.title=(text||files[0]?.name||'Chat').slice(0,40);
    c.updated=Date.now(); captureMemory(text); saveC(); renderSidebar(); renderChat();

    busy=true; sendBtn.disabled=true;
    const wrap=chat.querySelector('.wrap')||(()=>{const w=document.createElement('div');w.className='wrap';chat.appendChild(w);return w;})();
    const aiEl=bubble('ai',''); aiEl.querySelector('.who').insertAdjacentHTML('afterend','<span class="dots" id="d"><i></i><i></i><i></i></span>');
    wrap.appendChild(aiEl); chat.scrollTop=chat.scrollHeight;

    // messages to send: the real convo (user message without the file-name echo) + file text separately
    const outMsgs=c.messages.map(m=>({role:m.role,content:m.content}));
    outMsgs[outMsgs.length-1]={role:'user',content:text||'(see attached file)'};
    let full='';
    try{
      const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:outMsgs, files:files.map(f=>({name:f.name,text:f.text})), memory:memory.join('\n')})});
      if(!resp.body) throw new Error('no stream');
      const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='';
      const dots=aiEl.querySelector('#d');
      while(true){ const {done,value}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true});
        let idx; while((idx=buf.indexOf('\n\n'))>=0){ const block=buf.slice(0,idx); buf=buf.slice(idx+2);
          const dl=block.split('\n').find(l=>l.startsWith('data:')); if(!dl)continue; let j; try{j=JSON.parse(dl.slice(5).trim());}catch{continue;}
          if(j.delta){ if(dots){dots.remove();} full+=j.delta; aiEl._text.nodeValue=full; chat.scrollTop=chat.scrollHeight; }
          else if(j.error){ if(dots)dots.remove(); aiEl._text.nodeValue=''; const e=document.createElement('div'); e.className='err'; e.textContent=j.error; wrap.appendChild(e); }
        }
      }
      if(full){ c.messages.push({role:'assistant',content:full}); c.updated=Date.now(); saveC(); }
      else { aiEl.remove(); }
    }catch{
      aiEl.remove(); const e=document.createElement('div'); e.className='err'; e.textContent='Could not reach the server.'; wrap.appendChild(e);
    }
    busy=false; sendBtn.disabled=false; chat.scrollTop=chat.scrollHeight; input.focus();
  }

  function closeRail(){ document.body.classList.remove('open'); }
  $('newBtn').onclick=newChat; sendBtn.onclick=send;
  $('burger').onclick=()=>document.body.classList.toggle('open'); $('backdrop').onclick=closeRail;
  $('memBtn').onclick=showMemory;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
  $('plus').onclick=(e)=>{ e.stopPropagation(); $('menu').classList.toggle('open'); };
  $('addFiles').onclick=()=>{ $('menu').classList.remove('open'); $('fileInput').click(); };
  $('addFolder').onclick=()=>{ $('menu').classList.remove('open'); $('folderInput').click(); };
  $('slashCmd').onclick=()=>{ $('menu').classList.remove('open'); input.value='/'; input.focus(); slashRender('/'); };
  $('connectors').onclick=()=>{ $('menu').classList.remove('open'); toast('Connectors (Gmail, Slack…) — coming next 🙂'); };
  $('addPlugins').onclick=()=>{ $('menu').classList.remove('open'); toast('Plugins — coming next 🙂'); };
  $('fileInput').onchange=(e)=>{ handleFiles(e.target.files); e.target.value=''; };
  $('folderInput').onchange=(e)=>{ handleFiles(e.target.files, true); e.target.value=''; };
  document.addEventListener('click',()=>$('menu').classList.remove('open'));
  const COMMANDS=[{cmd:'/new',desc:'Start a new chat'},{cmd:'/clear',desc:'Clear this chat'},{cmd:'/memory',desc:'See what the AI remembers about you'},{cmd:'/help',desc:'List commands'}];
  function slashRender(q){ const el=$('slash'); const list=COMMANDS.filter(c=>c.cmd.startsWith(q.toLowerCase())); el.innerHTML='';
    list.forEach((c,i)=>{ const r=document.createElement('button'); r.className='slashrow'+(i===0?' sel':''); r.dataset.cmd=c.cmd;
      const b=document.createElement('b'); b.textContent=c.cmd; const s=document.createElement('span'); s.textContent=c.desc; r.append(b,s); r.onclick=()=>runCommand(c.cmd); el.appendChild(r); });
    el.classList.toggle('open', list.length>0); }
  function slashHide(){ $('slash').classList.remove('open'); }
  function runCommand(c){ input.value=''; slashHide();
    if(c==='/new') newChat();
    else if(c==='/clear'){ const cur=current(); if(cur){cur.messages=[]; cur.title='New chat'; saveC(); renderSidebar(); renderChat();} }
    else if(c==='/memory') showMemory();
    else toast('Commands:  /new   /clear   /memory'); }
  input.addEventListener('keydown',(e)=>{ const open=$('slash').classList.contains('open');
    if(e.key==='Escape'){ slashHide(); return; }
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault();
      if(open){ const first=$('slash').querySelector('.slashrow'); if(first){ runCommand(first.dataset.cmd); return; } }
      send(); } });
  input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,150)+'px';
    const v=input.value; if(v.startsWith('/')&&!v.includes(' ')) slashRender(v); else slashHide(); });

  load(); currentId=convos[0]?.id||null; if(!currentId)newChat(); else{renderSidebar();renderChat();}
</script>
</body>
</html>
