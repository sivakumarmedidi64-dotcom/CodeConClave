<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CodeConClave AI</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161922; --rail:#12141b; --line:#262b36; --fg:#e8ebf2; --dim:#9aa3b2;
    --gold:#d9b25a; --accent:#6ea8fe; --radius:12px;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;height:100vh;overflow:hidden}

  /* ---- sidebar ---- */
  .rail{width:260px;flex:0 0 260px;background:var(--rail);border-right:1px solid var(--line);
        display:flex;flex-direction:column;transition:margin-left .2s}
  .rail__top{padding:16px 14px 10px}
  .logo{font-size:15px;font-weight:800;letter-spacing:1.5px}
  .logo b{color:var(--gold)}
  .newbtn{margin:10px 14px;padding:10px;border:1px solid var(--line);background:#1b2030;color:var(--fg);
          border-radius:10px;cursor:pointer;font:inherit;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
  .newbtn:hover{border-color:var(--gold)}
  .convos{flex:1;overflow-y:auto;padding:6px 8px}
  .cnv{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--dim);font-size:13.5px}
  .cnv:hover{background:#1b2030;color:var(--fg)}
  .cnv.active{background:#223049;color:#eaf1ff}
  .cnv__t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cnv__x{opacity:0;border:none;background:none;color:var(--dim);cursor:pointer;font-size:15px;padding:0 2px}
  .cnv:hover .cnv__x{opacity:.7}
  .cnv__x:hover{color:#ff8a8a;opacity:1}
  .rail__foot{padding:10px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px}

  /* ---- main ---- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .burger{display:none;border:none;background:none;color:var(--fg);font-size:20px;cursor:pointer}
  .top__title{font-weight:700}.top__title b{color:var(--gold)}
  #chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:18px 16px}
  .wrap{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .msg{padding:11px 14px;border-radius:12px;max-width:85%;line-height:1.55;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:#223049;color:#eaf1ff;border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .ai .who{color:var(--gold);font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;display:block}
  .err{align-self:center;color:#ff8a8a;font-size:13px;text-align:center}
  .empty{margin:auto;text-align:center;color:var(--dim)}
  .empty .big{font-size:20px;color:var(--fg);font-weight:700;margin-bottom:6px}
  .empty .big b{color:var(--gold)}
  .barwrap{padding:10px 16px 18px}
  .bar{width:100%;max-width:760px;margin:0 auto;display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
  textarea{flex:1;min-width:0;resize:none;background:transparent;color:var(--fg);border:none;font:inherit;font-size:15px;padding:8px;max-height:150px}
  textarea:focus{outline:none}
  .send{cursor:pointer;border:none;border-radius:10px;padding:0 16px;font:inherit;font-weight:700;background:var(--gold);color:#201a08}
  .send:disabled{opacity:.5;cursor:default}
  .dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--gold);animation:b 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}

  .backdrop{display:none}
  @media(max-width:720px){
    .rail{position:fixed;z-index:20;height:100%;margin-left:-260px}
    body.open .rail{margin-left:0}
    body.open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
    .burger{display:block}
  }
</style>
</head>
<body>
  <aside class="rail">
    <div class="rail__top"><div class="logo">CODE<b>CON</b>CLAVE</div></div>
    <button class="newbtn" id="newBtn">＋ New chat</button>
    <div class="convos" id="convos"></div>
    <div class="rail__foot">Your own AI · chats saved on this device</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <div class="top">
      <button class="burger" id="burger">☰</button>
      <div class="top__title">CODE<b>CON</b>CLAVE AI</div>
    </div>
    <div id="chat"></div>
    <div class="barwrap">
      <div class="bar">
        <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
        <button class="send" id="send">Send</button>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const chat = $('chat'), input = $('input'), sendBtn = $('send'), convosEl = $('convos');
  const KEY = 'cc_convos_v1';
  let convos = [];      // [{id,title,messages:[{role,content}],updated}]
  let currentId = null;
  let busy = false;

  function load(){ try{ convos = JSON.parse(localStorage.getItem(KEY) || '[]') || []; }catch{ convos=[]; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(convos.slice(0,100))); }catch{} }
  function current(){ return convos.find(c => c.id === currentId); }
  function uid(){ return 'c' + Date.now() + Math.random().toString(36).slice(2,6); }

  function newChat(){
    currentId = uid();
    convos.unshift({ id: currentId, title: 'New chat', messages: [], updated: Date.now() });
    save(); renderSidebar(); renderChat(); input.focus(); closeRail();
  }
  function selectChat(id){ currentId = id; renderSidebar(); renderChat(); closeRail(); }
  function deleteChat(id, e){
    e.stopPropagation();
    convos = convos.filter(c => c.id !== id);
    if (currentId === id){ currentId = convos[0]?.id || null; if(!currentId) newChat(); }
    save(); renderSidebar(); renderChat();
  }

  function renderSidebar(){
    convosEl.innerHTML = '';
    convos.forEach(c => {
      const row = document.createElement('div');
      row.className = 'cnv' + (c.id === currentId ? ' active' : '');
      row.onclick = () => selectChat(c.id);
      const t = document.createElement('div'); t.className='cnv__t'; t.textContent = c.title || 'New chat';
      const x = document.createElement('button'); x.className='cnv__x'; x.textContent='×'; x.title='Delete';
      x.onclick = (e) => deleteChat(c.id, e);
      row.appendChild(t); row.appendChild(x); convosEl.appendChild(row);
    });
  }

  function bubble(role, text){
    const el = document.createElement('div');
    el.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
    if (role !== 'user'){ const w=document.createElement('span'); w.className='who'; w.textContent='CodeConClave AI'; el.appendChild(w); }
    el.appendChild(document.createTextNode(text));
    return el;
  }

  function renderChat(){
    chat.innerHTML = '';
    const c = current();
    if (!c || c.messages.length === 0){
      const e = document.createElement('div'); e.className='empty';
      e.innerHTML = '<div class="big">CODE<b>CON</b>CLAVE AI</div><div>Your own AI. Ask me anything.</div>';
      chat.appendChild(e); return;
    }
    const wrap = document.createElement('div'); wrap.className='wrap';
    c.messages.forEach(m => wrap.appendChild(bubble(m.role, m.content)));
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send(){
    if (busy) return;
    const text = input.value.trim(); if (!text) return;
    let c = current(); if (!c){ newChat(); c = current(); }
    input.value=''; input.style.height='auto';
    c.messages.push({ role:'user', content:text });
    if (c.title === 'New chat' || !c.title) c.title = text.slice(0,40);
    c.updated = Date.now(); save(); renderSidebar(); renderChat();

    busy = true; sendBtn.disabled = true;
    const wrap = chat.querySelector('.wrap') || (()=>{ const w=document.createElement('div'); w.className='wrap'; chat.appendChild(w); return w; })();
    const thinking = document.createElement('div'); thinking.className='msg ai';
    thinking.innerHTML = '<span class="who">CodeConClave AI</span><span class="dots"><i></i><i></i><i></i></span>';
    wrap.appendChild(thinking); chat.scrollTop = chat.scrollHeight;

    try{
      const r = await fetch('/api/chat', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ messages: c.messages.map(m => ({ role:m.role, content:m.content })) })
      });
      const data = await r.json();
      thinking.remove();
      if (r.ok && data.answer){
        c.messages.push({ role:'assistant', content:data.answer });
        c.updated = Date.now(); save();
      } else {
        const e=document.createElement('div'); e.className='err'; e.textContent = data.error || 'Something went wrong.'; wrap.appendChild(e);
      }
    }catch{
      thinking.remove();
      const e=document.createElement('div'); e.className='err'; e.textContent='Could not reach the server.'; wrap.appendChild(e);
    }
    renderChat();
    busy=false; sendBtn.disabled=false; input.focus();
  }

  function closeRail(){ document.body.classList.remove('open'); }

  // wire up
  $('newBtn').onclick = newChat;
  sendBtn.onclick = send;
  $('burger').onclick = () => document.body.classList.toggle('open');
  $('backdrop').onclick = closeRail;
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  input.addEventListener('input', ()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,150)+'px'; });

  load();
  currentId = convos[0]?.id || null;
  if (!currentId) newChat(); else { renderSidebar(); renderChat(); }
</script>
</body>
</html>
