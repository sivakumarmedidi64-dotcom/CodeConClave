<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CodeConClave</title>
<link rel="icon" href="/icon-192.png" />
<meta name="theme-color" content="#141414" />
<script src="/kit.js"></script>
<style>
  body{height:100vh;overflow:hidden}
  .ws{display:flex;height:100vh}
  .side{width:264px;flex:0 0 264px;background:var(--side);border-right:1px solid #262626;display:flex;flex-direction:column;transition:margin-left .2s}
  .side .top{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}.side .top img{height:28px}
  .kindtag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px}
  .switch{margin:6px 10px 10px;display:flex;align-items:center;gap:10px;background:#232323;border:1px solid #2e2e2e;border-radius:14px;padding:9px 10px;cursor:pointer;color:var(--fg);font:inherit;text-align:left}
  .switch:hover{background:#282828}.switch .nm{flex:1;min-width:0}.switch .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.switch .nm span{color:var(--dim);font-size:12px}
  .av{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#111;flex:0 0 auto}
  .av.round{border-radius:50%}
  .nav{flex:1;overflow-y:auto;padding:4px 8px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;color:#cfcfcf;font:inherit;font-size:14.5px;padding:9px 11px;border-radius:10px;cursor:pointer;text-align:left}
  .nav button:hover{background:#262626;color:var(--fg)}.nav button.on{background:#2c2c2c;color:var(--fg)}
  .nav .lbl{color:var(--dim2);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:14px 11px 6px}
  .foot{border-top:1px solid #262626;padding:10px}
  .me{display:flex;align-items:center;gap:10px;padding:6px 4px}.me .nm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .others{display:flex;gap:6px;margin-top:6px}.others a{flex:1;text-align:center;font-size:12.5px;color:var(--dim);text-decoration:none;border:1px solid #2e2e2e;border-radius:9px;padding:6px 4px}.others a:hover{color:var(--fg);background:#232323}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .head{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid #222;min-height:62px}
  .head h1{font-size:19px;margin:0;flex:1;display:flex;align-items:center;gap:10px}.head h1 .k-ico{width:20px;height:20px;color:var(--dim)}
  .burger{display:none;border:none;background:none;color:var(--fg);cursor:pointer;padding:4px}
  .body{flex:1;overflow-y:auto;padding:22px}
  .inner{max-width:1100px;margin:0 auto}
  .menu{position:absolute;z-index:30;background:#262626;border:1px solid #3a3a3a;border-radius:14px;padding:6px;min-width:240px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;color:var(--fg);font:inherit;font-size:14px;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left}.menu button:hover{background:#303030}
  .menu hr{border:none;border-top:1px solid #333;margin:5px 0}
  /* chat */
  .chat{display:flex;flex-direction:column;height:calc(100vh - 62px - 44px);max-width:900px;margin:0 auto}
  .log{flex:1;overflow-y:auto;padding:6px 4px 14px}
  .msg{display:flex;gap:12px;padding:8px 6px;border-radius:12px}.msg:hover{background:#1b1b1b}
  .msg .who{font-weight:600;font-size:14px}.msg .who span{color:var(--dim2);font-weight:400;font-size:12px;margin-left:8px}
  .msg .txt{white-space:pre-wrap;line-height:1.55;font-size:14.5px;color:#e3e3e3;margin-top:2px}
  .msg.ai .who{color:var(--yel)}
  .composer{display:flex;gap:10px;align-items:flex-end;background:#1d1d1d;border:1px solid #333;border-radius:16px;padding:10px 10px 10px 14px}
  .composer textarea{flex:1;background:none;border:none;color:var(--fg);font:inherit;font-size:15px;resize:none;outline:none;max-height:160px;min-height:24px;line-height:1.5}
  /* boards & cards */
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .col{background:#1a1a1a;border:1px solid #262626;border-radius:16px;padding:12px;min-height:240px}
  .col h4{margin:2px 4px 12px;font-size:13px;color:var(--dim);display:flex;justify-content:space-between}
  .tcard{background:#222;border:1px solid #2e2e2e;border-radius:12px;padding:11px 12px;margin-bottom:10px}
  .tcard .t{font-size:14.5px;line-height:1.4}.tcard .m{color:var(--dim);font-size:12.5px;margin-top:6px}
  .tcard ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:#cfcfcf}.tcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tcard select{background:#2a2a2a;color:var(--fg);border:1px solid #3a3a3a;border-radius:8px;font-size:12px;padding:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .stat{background:#1f1f1f;border:1px solid #2a2a2a;border-radius:16px;padding:16px}.stat b{display:block;font-size:30px;letter-spacing:-.02em}.stat span{color:var(--dim);font-size:13px}
  .sec{margin:22px 0 10px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .row{display:flex;align-items:center;gap:12px;background:#1f1f1f;border:1px solid #2a2a2a;border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .row .grow{flex:1;min-width:0}.row b{display:block;font-weight:500}.row .k-muted{font-size:13px}
  .role{font-size:12px;background:#2c2c2c;border-radius:999px;padding:3px 10px;color:#cfcfcf;text-transform:capitalize}
  .pages{display:grid;grid-template-columns:250px 1fr;gap:16px}
  .plist button{display:block;width:100%;text-align:left;background:#1f1f1f;border:1px solid #2a2a2a;color:var(--fg);border-radius:11px;padding:10px 12px;margin-bottom:6px;font:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plist button.on{border-color:var(--blue)}
  .ptitle{width:100%;background:none;border:none;color:var(--fg);font:inherit;font-size:26px;font-weight:700;outline:none;margin-bottom:10px}
  .table{width:100%;border-collapse:collapse;font-size:13.5px}.table td,.table th{border-bottom:1px solid #262626;padding:9px 8px;text-align:left;vertical-align:top}.table th{color:var(--dim);font-weight:500}
  .chk{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14.5px;cursor:pointer}.chk input{width:18px;height:18px;margin-top:1px;accent-color:#3d9bff}
  .src{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.src span{font-size:12px;background:#2a2a2a;border-radius:8px;padding:3px 9px;color:#cfcfcf}
  .empty{text-align:center;color:var(--dim);padding:60px 20px;line-height:1.7}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .welcome{max-width:520px;width:100%;text-align:center}.welcome img{height:56px;margin-bottom:18px}.welcome h1{font-size:30px;margin:0 0 8px}.welcome .k-muted{margin-bottom:22px;line-height:1.6}
  .welcome .k-card{text-align:left;margin-top:14px}
  @media(max-width:860px){ .side{position:fixed;z-index:40;height:100%;margin-left:-264px} body.open .side{margin-left:0} .burger{display:block} .kan{grid-template-columns:1fr} .pages{grid-template-columns:1fr} .body{padding:16px} .head{padding:12px 16px} }
</style>
</head>
<body>
<div id="app"></div>
<script src="/workspace.js"></script>
</body>
</html>
