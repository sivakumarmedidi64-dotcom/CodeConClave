<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shared from CodeConClave</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/icon-192.png" />
<meta name="theme-color" content="#141414" />
<script src="/kit.js"></script>
<style>
  body{min-height:100vh}
  .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(20,20,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid #222}
  .bar img{height:28px;display:block}.bar .sp{flex:1}
  .wrap{max-width:960px;margin:0 auto;padding:30px 20px 80px}
  .eyebrow{color:var(--dim);font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .vis{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:3px 10px}
  .vis.pub{background:rgba(61,155,255,.14);color:#7cc0ff}.vis.pri{background:#2a2a2a;color:#cfcfcf}.vis .k-ico{width:13px;height:13px}
  h1.t{font-size:34px;letter-spacing:-.02em;margin:12px 0 6px;line-height:1.15;overflow-wrap:anywhere}
  .meta{color:var(--dim);font-size:13.5px}
  .md{line-height:1.75;font-size:16px;color:#e4e4e4;overflow-wrap:anywhere;margin-top:22px}
  .md h2{font-size:24px;margin:28px 0 10px}.md h3{font-size:19px;margin:24px 0 8px}.md h4{font-size:16px;margin:20px 0 6px}
  .md p{margin:0 0 12px}.md ul,.md ol{margin:0 0 12px;padding-left:22px}.md li{margin:3px 0}
  .md pre{background:#1b1b1b;border:1px solid #2a2a2a;border-radius:12px;padding:14px;overflow-x:auto;font-size:13.5px;line-height:1.55}
  .md code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:#232323;border-radius:6px;padding:1px 5px}.md pre code{background:none;padding:0}
  .md a{color:var(--blue)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 18px}
  .tabs button{border:none;background:none;color:var(--dim);font:inherit;font-size:15px;padding:7px 14px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:#2a2a2a;color:var(--fg);font-weight:600}
  .kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
  .col{background:#1a1a1a;border:1px solid #262626;border-radius:14px;padding:12px;min-height:160px}
  .col h4{margin:2px 4px 12px;font-size:13px;color:var(--dim);display:flex;justify-content:space-between}
  .tcard{background:#222;border:1px solid #2e2e2e;border-radius:12px;padding:11px 12px;margin-bottom:10px;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
  .tcard .m{color:var(--dim);font-size:12.5px;margin-top:6px}
  .pg{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}
  .plist button{display:block;width:100%;text-align:left;background:#1d1d1d;border:1px solid #2a2a2a;color:var(--fg);border-radius:10px;padding:9px 12px;margin-bottom:6px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plist button.on{border-color:#5a5a5a;background:#262626}.plist .k-ico{width:15px;height:15px;vertical-align:-3px;color:var(--dim)}
  .pg .md{margin-top:0}.pg h2.pt{font-size:26px;margin:0 0 4px}
  .chat{margin-top:22px;display:flex;flex-direction:column;gap:16px}
  .msg{display:flex;gap:12px;align-items:flex-start}
  .msg.me{justify-content:flex-end}.msg.me .bub{background:#262626;border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:80%;white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}
  .msg.ai img{width:30px;height:30px;border-radius:50%;flex:0 0 auto}.msg.ai .who{color:var(--yel);font-weight:600;font-size:13.5px;margin-bottom:2px}
  .msg.ai .body{min-width:0;flex:1}.msg.ai .md{margin-top:0;font-size:15px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .cards .k-card{cursor:pointer}.cards .k-card:hover{border-color:#3d3d3d}.cards b{display:block;margin-bottom:4px}
  .empty{color:var(--dim);text-align:center;padding:40px 10px}
  .center{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center}
  .note{max-width:460px;text-align:center}.note .big{width:40px;height:40px;color:var(--dim);margin-bottom:6px}.note h2{margin:6px 0 8px}
  .foot{margin-top:56px;padding-top:20px;border-top:1px solid #232323;color:var(--dim);font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .foot img{height:20px}.foot a{color:var(--fg)}
  @media(max-width:680px){ .kan,.pg{grid-template-columns:1fr} h1.t{font-size:27px} .wrap{padding:22px 16px 60px} .bar{padding:10px 16px} }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const {$,el,ico,btn,toast,signIn,loadMe,ago}=cc;
  const app=$('app'), token=decodeURIComponent(location.pathname.split('/')[2]||'');
  const LOCK='<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', GLOBE='<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/>';
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // a small, safe Markdown: text is escaped first; only http(s) links
  const inline=(s)=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener nofollow ugc">$1</a>');
  function md(text){
    const out=[], lines=String(text||'').replace(/\r/g,'').split('\n'); let i=0, list=null;
    const close=()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
    while(i<lines.length){ const L=lines[i]; let m;
      if(/^\s*```/.test(L)){ close(); const buf=[]; i++; while(i<lines.length&&!/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; } i++; out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue; }
      if((m=L.match(/^(#{1,3})\s+(.*)/))){ close(); const n=m[1].length+1; out.push('<h'+n+'>'+inline(esc(m[2]))+'</h'+n+'>'); }
      else if((m=L.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; } out.push('<li>'+inline(esc(m[1]))+'</li>'); }
      else if((m=L.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; } out.push('<li>'+inline(esc(m[1]))+'</li>'); }
      else if(!L.trim()) close();
      else { close(); out.push('<p>'+inline(esc(L))+'</p>'); }
      i++; }
    close(); return out.join('');
  }
  function topbar(d){ const b=el('div','bar'); b.innerHTML='<a href="/?home=1" title="CodeConClave"><img src="/logo.png" alt="CodeConClave"></a>'; b.appendChild(el('span','sp'));
    if(d&&d.member&&d.space&&d.space.id){ const a=el('a','k-btn sm pri','Open in your team'); a.href='/team?space='+encodeURIComponent(d.space.id); b.appendChild(a); }
    else { const a=el('a','k-btn sm yel','Try CodeConClave free'); a.href='/?home=1'; b.appendChild(a); }
    return b; }
  function footer(w){ const f=el('div','foot'); f.innerHTML='<img src="/icon-192.png" alt="">'; f.append('Made with CodeConClave AI — your autonomous intelligence workspace. '); const a=el('a',null,'Try it free →'); a.href='/?home=1'; f.appendChild(a); w.appendChild(f); }
  function problem(d){
    app.innerHTML=''; app.appendChild(topbar(null)); const w=el('div','center'), c=el('div','k-card note');
    c.innerHTML=ico(d.private?LOCK:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>','big');
    c.appendChild(el('h2',null,d.private?'This link is private':'This link does not work')); c.appendChild(el('p','k-muted',d.error||'Something went wrong.'));
    if(d.private&&!d.signedIn){ const r=el('div','k-row'); r.style.justifyContent='center';
      r.append(btn('Sign in',async()=>{ if(await signIn('signin','Sign in with the account you use in '+(d.space&&d.space.name||'the team')+'.')) load(); },'pri'),btn('Create account',async()=>{ if(await signIn('signup')) load(); })); c.appendChild(r); }
    w.appendChild(c); app.appendChild(w); }
  function pageView(box,p){ if(!p) return box.appendChild(el('div','empty','This page is empty.'));
    const a=el('article','md'); a.innerHTML=md(p.body)||'<p class="k-muted">This page is empty.</p>'; box.appendChild(a);
    box.appendChild(el('div','meta','Last edited '+ago(p.editedAt)+(p.byName?' by '+p.byName:''))).style.marginTop='18px'; }
  function chatView(box,c){ const list=el('div','chat');
    (c&&c.messages||[]).forEach((m)=>{ const row=el('div','msg '+(m.role==='user'?'me':'ai'));
      if(m.role==='user') row.appendChild(el('div','bub',m.content));
      else { const im=el('img'); im.src='/icon-192.png'; im.alt=''; const b=el('div','body'); b.appendChild(el('div','who','CodeConClave AI')); const t=el('div','md'); t.innerHTML=md(m.content); b.appendChild(t); row.append(im,b); }
      list.appendChild(row); });
    if(!list.children.length) list.appendChild(el('div','empty','This chat is empty.')); box.appendChild(list); }
  function tasksView(box,tasks){ const k=el('div','kan');
    [['todo','To do'],['doing','Doing'],['done','Done']].forEach(([s,n])=>{ const mine=(tasks||[]).filter((t)=>t.status===s), col=el('div','col'), h=el('h4'); h.append(el('span',null,n),el('span',null,String(mine.length))); col.appendChild(h);
      if(!mine.length) col.appendChild(el('div','k-muted k-small','Nothing here.'));
      mine.forEach((t)=>{ const c=el('div','tcard',t.title); const meta=[t.who?'for '+t.who:'',t.estimate||''].filter(Boolean).join(' · '); if(meta) c.appendChild(el('div','m',meta)); col.appendChild(c); });
      k.appendChild(col); }); box.appendChild(k); }
  function pagesView(box,pages){ if(!pages.length) return box.appendChild(el('div','empty','No pages yet.'));
    const g=el('div','pg'), left=el('div','plist'), right=el('div'); g.append(left,right); box.appendChild(g);
    const show=(p,b)=>{ left.querySelectorAll('button').forEach((x)=>x.classList.toggle('on',x===b)); right.innerHTML=''; right.appendChild(el('h2','pt',p.title)); right.appendChild(el('div','meta','Edited '+ago(p.editedAt)+(p.byName?' by '+p.byName:''))); const a=el('article','md'); a.style.marginTop='18px'; a.innerHTML=md(p.body)||'<p class="k-muted">This page is empty.</p>'; right.appendChild(a); };
    pages.forEach((p,i)=>{ const b=el('button'); b.innerHTML=ico('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>'); b.append(' '+p.title); b.onclick=()=>show(p,b); left.appendChild(b); if(!i) setTimeout(()=>show(p,b)); }); }
  function chatsView(box,chats){ if(!chats.length) return box.appendChild(el('div','empty','No shared AI chats yet.'));
    const g=el('div','cards'); chats.forEach((c)=>{ const k=el('div','k-card'); k.appendChild(el('b',null,c.title)); k.appendChild(el('div','k-muted k-small',(c.messages.length)+' messages · '+(c.byName||'')+' · '+ago(c.at)));
      k.onclick=()=>{ box.innerHTML=''; const bk=btn('← All chats',()=>{ box.innerHTML=''; chatsView(box,chats); },'sm'); box.appendChild(bk); box.appendChild(el('h2',null,c.title)).style.margin='16px 0 0'; chatView(box,c); window.scrollTo({top:0,behavior:'smooth'}); }; g.appendChild(k); });
    box.appendChild(g); }
  function render(d){
    document.title=d.title+' · '+d.space.name+' — CodeConClave';
    app.innerHTML=''; app.appendChild(topbar(d)); const w=el('div','wrap'); app.appendChild(w);
    const eb=el('div','eyebrow'); eb.appendChild(el('span',null,'Shared from '+d.space.name));
    const v=el('span','vis '+(d.visibility==='public'?'pub':'pri')); v.innerHTML=ico(d.visibility==='public'?GLOBE:LOCK); v.append(d.visibility==='public'?'Public · view only':'Private · team only'); eb.appendChild(v); w.appendChild(eb);
    w.appendChild(el('h1','t',d.title)); w.appendChild(el('div','meta','Shared by '+(d.byName||'a teammate')+' · '+ago(d.at)));
    const C=d.content||{}, box=el('div'); w.appendChild(box);
    if(d.what==='page') pageView(box,C.page);
    else if(d.what==='chat') chatView(box,C.chat);
    else if(d.what==='tasks') tasksView(box,C.tasks);
    else { const tabs=el('div','tabs'), inner=el('div'); box.append(tabs,inner);
      const T=[['Pages',(C.pages||[]).length,()=>pagesView(inner,C.pages||[])],['Tasks',(C.tasks||[]).length,()=>tasksView(inner,C.tasks||[])],['AI chats',(C.chats||[]).length,()=>chatsView(inner,C.chats||[])]];
      const first=Math.max(0,T.findIndex((x)=>x[1]>0)); // open the first tab that has something in it
      T.forEach(([n,c,fn],i)=>{ const b=el('button',i===first?'on':null,n+' · '+c); b.onclick=()=>{ tabs.querySelectorAll('button').forEach((x)=>x.classList.toggle('on',x===b)); inner.innerHTML=''; fn(); }; tabs.appendChild(b); });
      T[first][2](); }
    footer(w);
  }
  async function load(){
    app.innerHTML='<div class="wrap"><div class="k-muted">Opening the link…</div></div>';
    await loadMe();
    let r, d; try{ r=await fetch('/api/share/'+encodeURIComponent(token)); d=await r.json(); }catch{ return problem({error:'Could not open this link — check your internet and try again.'}); }
    if(!r.ok) return problem(d||{}); render(d);
  }
  load();
})();
</script>
</body>
</html>
