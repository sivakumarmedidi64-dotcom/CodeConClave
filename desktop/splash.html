<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeConClave AI</title>
<style>
  html,body{height:100%;margin:0;background:#1a1a1a;color:#e6e6e6;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 16px}
  img{width:280px;max-width:80vw}
  .dim{color:#8c8c8c}
  .dots i{display:inline-block;width:7px;height:7px;margin:0 3px;border-radius:50%;background:#8c8c8c;animation:b 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  a{color:#1a93fe}
  #off{display:none}
</style>
</head>
<body>
  <img src="logo.png" alt="CodeConClave">
  <div id="on"><div class="dots"><i></i><i></i><i></i></div><div class="dim">Waking up CodeConClave AI…</div></div>
  <div id="off"><div>Can’t reach CodeConClave AI.</div><div class="dim">Check your internet connection, then <a href="https://codeconclave-ww5x.onrender.com">try again</a>.</div></div>
  <script>
    if (new URLSearchParams(location.search).get('offline')) { document.getElementById('on').style.display = 'none'; document.getElementById('off').style.display = 'block'; }
  </script>
</body>
</html>
